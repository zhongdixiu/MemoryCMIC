[project]
name = "memory-cmic"
version = "0.1.0"
description = "Unified memory service data-model validation"
requires-python = ">=3.11,<4.0"
dependencies = [
    "alembic>=1.13,<2.0",
    "pgvector>=0.3,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
]

[tool.poetry]
packages = [{ include = "memory_cmic", from = "src" }]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
